name: Auto Release

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  rolling-release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Make Gradle wrapper executable
        run: chmod +x ./gradlew

      - name: Build release APK
        run: ./gradlew assembleRelease

      - name: Prepare APK name
        run: |
          mkdir -p app/build/outputs/apk/release/
          cp app/build/outputs/apk/release/*.apk app/build/outputs/apk/release/WakeTag.apk

      - name: Create Unique Auto Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: "v${{ github.run_number }}"
          name: "WakeTag Build v${{ github.run_number }}"
          generate_release_notes: true
          files: app/build/outputs/apk/release/WakeTag.apk
